# ABOUTME: pre-commit hooks for the PyTexas infra repo. Primary job: stop plaintext
# secrets from ever being committed (the one real risk of a public infra repo).
# Install once: `pre-commit install` (pip install pre-commit, or brew/apt).

repos:
  # Scan staged changes for secrets before every commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # A few cheap correctness checks while we're here.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict   # catch leftover <<<<<<< markers
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: '\.sops\.ya?ml$'  # sops files aren't plain YAML
