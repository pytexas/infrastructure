# ABOUTME: Baseline droplet hardening -- packages, deploy user, SSH lockdown, auto-updates.
# Idempotent; safe to re-run.

# On a freshly-created droplet, cloud-init runs apt operations during first boot
# (unattended-upgrades, package installs). Blocking here avoids racing the dpkg
# lock. On subsequent runs cloud-init is already "done" and this returns immediately.
- name: Wait for cloud-init to finish (first-boot apt lock contention)
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - htop
      - jq
      - just
      - python3-apt
      - rsync
      - unattended-upgrades
      - fail2ban
    state: present
    lock_timeout: 120

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure deploy user exists
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    state: present

- name: Grant deploy user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ deploy_user }}"
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Capture root's authorized_keys for fallback copy to deploy user
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: root_authorized_keys
  when: deploy_user_authorized_keys | length == 0

- name: Authorize SSH keys for deploy user (explicit list)
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ deploy_user_authorized_keys }}"
  when: deploy_user_authorized_keys | length > 0

- name: Authorize SSH keys for deploy user (copy from root)
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ root_authorized_keys.content | b64decode }}"
    state: present
  when: deploy_user_authorized_keys | length == 0

- name: Harden sshd -- no root login, no passwords
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-pytexas.conf
    content: |
      # Managed by ansible (roles/bootstrap)
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
    owner: root
    group: root
    mode: "0644"
  notify: restart sshd

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Ensure fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
