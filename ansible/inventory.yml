# ABOUTME: Static inventory for the PyTexas droplet(s).
# Populate ansible_host from `terraform output droplet_ipv4` after applying.
# For multi-host setups, copy this file to inventory.local.yml (gitignored) and edit there.

all:
  vars:
    # Day-2 default: connect as the deploy user (root login is disabled by the
    # bootstrap role after the first apply). `just apply` auto-detects and overrides
    # this via `-e ansible_user=...` -- it falls back to root on a fresh droplet where
    # the deploy user does not exist yet. For a direct `ansible-playbook` run against a
    # brand-new droplet, override with `-e ansible_user=root`.
    ansible_user: pytexas
    ansible_python_interpreter: /usr/bin/python3

  children:
    pytexas:
      hosts:
        pytexas-1:
          ansible_host: REPLACE_WITH_DROPLET_IPV4
